[package]
name = "drupal-index"
version = "0.1.0"
edition = "2024"
description = "Fast local indexer for drupal/drupal (main) using tree-sitter-php, YAML metadata, and SQLite FTS5"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tree-sitter = "0.24"
tree-sitter-php = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
